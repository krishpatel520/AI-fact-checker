# secrets.yaml
# -----------
# IMPORTANT: Base64-encode your real values before applying.
# Generate: echo -n "your_value" | base64
#
# DO NOT commit real secrets to git. Use a secrets manager
# (Vault, AWS Secrets Manager, Sealed Secrets) in production.

apiVersion: v1
kind: Secret
metadata:
  name: veritas-secrets
  namespace: veritas
type: Opaque
data:
  # echo -n "your_serper_api_key" | base64
  SERPER_API_KEY: eW91cl9zZXJwZXJfa2V5X2hlcmU=

  # echo -n "veritas" | base64
  POSTGRES_PASSWORD: dmVyaXRhcw==

  # DATABASE_URL — include the full connection string here so it never appears in ConfigMap.
  # echo -n "postgresql://veritas:<password>@postgres:5432/veritas" | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3Zlcml0YXM6Y2hhbmdlbWVAcG9zdGdyZXM6NTQzMi92ZXJpdGFz

  # Set strong credentials — do not leave as defaults.
  # echo -n "your_flower_user" | base64
  FLOWER_USER: eW91cl9mbG93ZXJfdXNlcg==

  # echo -n "your_strong_password" | base64
  FLOWER_PASSWORD: eW91cl9zdHJvbmdfcGFzc3dvcmQ=

  # Optional — ScrapingBee
  # SCRAPINGBEE_API_KEY: <base64>
